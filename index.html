<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        *{ 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body{ 
            font-family: Arial, Helvetica, sans-serif; 
            background-color: white; 
            font-size: 18px; 
        }

        .main-container{ 
            display: flex; 
            padding: 30px; 
            justify-content: center; 
            width: 100%; 
            min-height: 100vh; 
            align-items: center; 
        }


        .form-container{ 
            width: 480px; 
            padding: 50px; 
            background-color: #15803d; 
            border-radius: 14px; 
            box-shadow: 0 4px 15px gray; 
        }


        h2{
             margin-bottom: 20px; 
            text-align: center; 
            color: white; 
            font-size: 28px; 
        }

        .form-group{ 
            margin-bottom: 15px; 
        }


        .form-group label{ 
            display: block; 
            color: white; 
            font-weight: 700; 
            margin-bottom: 7px; 
        }


        .form-group input, .form-group select{ 
            width: 100%; 
            padding: 10px; 
            border-radius: 5px; 
            border: none; 
            font-size: 16px; 
        }


        .radio-group{ 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
        }


        .radio-group label{ 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            font-weight: normal; 
        }


        button{ 
            width: 100%;
            padding: 12px;
            color: white;
            background-color: blue;
            border: none; 
            border-radius: 5px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }

        button:hover{ 
            background-color: #0000cc; 
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-container">
            <h2>Student Registration Form</h2>
            <form id="regForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="registration_number">Registration Number:</label>
                    <input type="text" id="registration_number" name="registration_number" required placeholder="Enter Reg.No.">
                </div>
                <div class="form-group">
                    <label for="email"> Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm password:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm password">
                </div>
                <div class="form-group">
                    <label>Year Of Study:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="year" value="Year1" required>Year1</label>
                        <label><input type="radio" name="year" value="Year2">Year2</label>
                        <label><input type="radio" name="year" value="Year3">Year3</label>
                        <label><input type="radio" name="year" value="Year4">Year4</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="course">Course:</label>
                    <select name="course" id="course" required>
                        <option value="" disabled selected>Select Your course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Applied Computer Science">Applied Computer Science</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Computer Security">Computer Security</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e){
            e.preventDefault();

            let name = document.getElementById('name').value;
            let regNo = document.getElementById('registration_number').value;
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirm-password').value;
            let course = document.getElementById('course').value;
            let year = document.querySelector('input[name="year"]:checked');

            if(password !== confirmPassword) {
                alert("Error: Passwords do not match!");
                return;
            }

            if(!year){
                alert("Please select Year of Study");
                return;
            }

            let student = {
                name: name,
                regNo: regNo,
                email: email,
                course: course,
                year: year.value
            };

            localStorage.setItem('student', JSON.stringify(student));
            console.log("Registered Student:", student);

            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
